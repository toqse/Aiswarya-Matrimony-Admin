name: Deploy Admin Portal

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.aiswaryamatrimonials.com

      - name: Deploy to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # Keep previous hashed JS chunks so open tabs still work after deploy.
          switches: -avzr
          path: dist/
          remote_path: /var/www/admin/
          remote_host: ${{ secrets.HOST }}
          remote_port: ${{ secrets.PORT }}
          remote_user: ${{ secrets.USERNAME }}
          remote_key: ${{ secrets.SSH_KEY }}
